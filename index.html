<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBMC Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" type="text/css" href="styles.css">

</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <img src="logo.png" width="40">
        </a>
        <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="#">Contact Us</a></li>
            </ul>
            <form class="d-flex">
                <input class="form-control me-2" type="search" placeholder="Search">
                <button class="btn btn-primary">Search</button>
            </form>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="row g-4">
        <div class="col-lg-6">
            <div class="content-wrapper">
                <h2 class="text-center">School Office Hours</h2>

                <table class="table table-striped table-bordered mt-3">
                    <thead class="table-primary">
                        <tr>
                            <th>Day</th>
                            <th>Office Hours</th>
                            <th>Department</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Monday</td>
                            <td>8:00 AM – 4:00 PM</td>
                            <td>Registrar's Office</td>
                        </tr>
                        <tr>
                            <td>Tuesday</td>
                            <td>8:00 AM – 4:00 PM</td>
                            <td>Accounting Office</td>
                        </tr>
                        <tr>
                            <td>Wednesday</td>
                            <td>8:00 AM – 4:00 PM</td>
                            <td>Guidance Office</td>
                        </tr>
                        <tr>
                            <td>Thursday</td>
                            <td>8:00 AM – 4:00 PM</td>
                            <td>Principal's Office</td>
                        </tr>
                        <tr>
                            <td>Friday</td>
                            <td>8:00 AM – 3:00 PM</td>
                            <td>Admin Office</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="content-wrapper">
                <h2 class="text-center">Contact Us</h2>

                <form>
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="name" class="form-control" placeholder="Enter your full name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" placeholder="Enter your email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Subject</label>
                        <input type="text" class="form-control" placeholder="Enter subject">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="4" placeholder="Type your message here"></textarea>
                    </div>

                    <button class="btn btn-primary w-100">Send Message</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
